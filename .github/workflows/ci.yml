name: Seed CI

on:
  push:
  pull_request:

jobs:
  test-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bootstrap
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python scripts/bootstrap.py --help
